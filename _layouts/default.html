<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alice&family=Archivo+Black&family=Arimo:ital,wght@0,400..700;1,400..700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Exo:ital,wght@0,100..900;1,100..900&family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=League+Spartan:wght@100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      window.JEKYLL_BASEURL = "{{ site.baseurl }}";
    </script>
  </head>

  <body>
    <header class="site-header">
      <div class="header-container">
        <a href="{{ '/' | relative_url }}" class="site-brand">
          <img
            class="site-logo"
            src="{{ '/assets/images/logo.png' | relative_url }}"
            alt="Logo Desa Sigaol Simbolon"
          />
          <span class="site-name open-sans-bold">Desa Sigaol Simbolon</span>
        </a>

        <button
          class="nav-toggle"
          type="button"
          aria-label="Buka navigasi"
          aria-expanded="false"
          aria-controls="site-navigation"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="site-nav" id="site-navigation" aria-label="Navigasi utama">
          <a
            href="{{ '/' | relative_url }}#beranda"
            data-section="beranda"
            class="open-sans-bold"
          >
            Beranda
          </a>

          <a
            href="{{ '/' | relative_url }}#destinasi"
            data-section="destinasi"
            class="open-sans-bold"
          >
            Wisata
          </a>

          <a
            href="{{ '/accommodation.html' | relative_url }}"
            data-section="penginapan"
            class="open-sans-bold"
          >
            Penginapan
          </a>

          <a
            href="{{ '/culinary.html' | relative_url }}#kuliner"
            data-section="kuliner"
            class="open-sans-bold"
          >
            Kuliner
          </a>

          <a
            href="{{ '/gallery.html' | relative_url }}#galeri"
            data-section="galeri"
            class="open-sans-bold"
          >
            Galeri
          </a>
        </nav>
      </div>
    </header>

    <main>{{ content }}</main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>
          &copy; {{ 'now' | date: "%Y" }} Desa Wisata {{ site.data.village.name
          }}. Dibuat dengan Jekyll.
        </p>
      </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
